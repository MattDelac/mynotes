name: CI Screenshots

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            api/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --command pnpm store path | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: nix develop --command npx playwright install chromium
        working-directory: apps/web

      - name: Generate screenshots
        run: nix develop --command pnpm exec playwright test --config screenshots.playwright.config.ts
        working-directory: apps/web
        env:
          CI: "true"

      - name: Verify screenshots are up to date
        run: |
          git add screenshots/
          git diff --cached --exit-code screenshots/
