name: Screenshots

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Cache pnpm store and cargo target
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/screenshots-cache/pnpm-store
            ${{ runner.temp }}/screenshots-cache/target
          key: screenshots-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'api/Cargo.lock', 'apps/web/screenshots.Dockerfile') }}
          restore-keys: |
            screenshots-${{ runner.os }}-

      - name: Generate screenshots
        env:
          SCREENSHOTS_CACHE: ${{ runner.temp }}/screenshots-cache
        run: bash scripts/screenshots.sh

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/screenshots
          token: ${{ secrets.GH_TOKEN}}
          commit-message: 'chore: regenerate UI screenshots'
          title: 'chore: regenerate UI screenshots'
          body: 'Automated screenshot regeneration. Triggered manually via workflow_dispatch.'
          delete-branch: true
