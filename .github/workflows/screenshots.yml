name: Screenshots

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --command pnpm store path | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: nix develop --command npx playwright install chromium
        working-directory: apps/web

      - name: Generate screenshots
        run: nix develop --command pnpm exec playwright test --config screenshots.playwright.config.ts
        working-directory: apps/web
        env:
          CI: "true"

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/screenshots
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: regenerate UI screenshots'
          title: 'chore: regenerate UI screenshots'
          body: 'Automated screenshot regeneration. Triggered manually via workflow_dispatch.'
          delete-branch: true
