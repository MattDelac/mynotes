name: Preview

on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number to deploy (defaults to the calling PR)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/mattdelac/mynotes-web
  API_IMAGE: ghcr.io/mattdelac/mynotes-api
  TS_NET: tailc5018.ts.net
  PR_NUMBER: ${{ inputs.pr-number || github.event.number }}
  NAMESPACE: preview-pr-mattdelac-mynotes-${{ inputs.pr-number || github.event.number }}
  WEB_HOST: pr-${{ inputs.pr-number || github.event.number }}-mynotes
  API_HOST: pr-${{ inputs.pr-number || github.event.number }}-mynotes-api

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-api
        with:
          images: ${{ env.API_IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=preview-api
          cache-to: type=gha,mode=max,scope=preview-api

      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: type=sha,prefix=sha-,format=short

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            PUBLIC_API_URL=https://${{ env.API_HOST }}.${{ env.TS_NET }}
          cache-from: type=gha,scope=preview-web
          cache-to: type=gha,mode=max,scope=preview-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy preview
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Create namespace
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          # GHCR pull auth (new preview namespaces do not inherit cluster secrets)
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GH_TOKEN }}" \
            -n "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Deploy both services (API on an emptyDir — no Litestream in previews)
          kubectl apply -n "${NAMESPACE}" -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mynotes-api
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mynotes-api
            template:
              metadata:
                labels:
                  app: mynotes-api
              spec:
                imagePullSecrets:
                  - name: ghcr-pull-secret
                securityContext:
                  fsGroup: 65532
                containers:
                  - name: mynotes-api
                    image: ${API_IMAGE}:sha-${SHA}
                    ports:
                      - containerPort: 3000
                    env:
                      - name: TRUST_PROXY_HEADERS
                        value: "true"
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
                    resources:
                      requests:
                        memory: 64Mi
                        cpu: 50m
                      limits:
                        memory: 256Mi
                        cpu: 500m
                    volumeMounts:
                      - name: data
                        mountPath: /data
                volumes:
                  - name: data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mynotes-api
          spec:
            selector:
              app: mynotes-api
            ports:
              - port: 80
                targetPort: 3000
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: mynotes-api
            annotations:
              tailscale.com/hostname: ${API_HOST}
          spec:
            ingressClassName: tailscale
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mynotes-api
                          port:
                            number: 80
            tls:
              - hosts:
                  - ${API_HOST}
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mynotes-web
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mynotes-web
            template:
              metadata:
                labels:
                  app: mynotes-web
              spec:
                imagePullSecrets:
                  - name: ghcr-pull-secret
                containers:
                  - name: mynotes-web
                    image: ${WEB_IMAGE}:sha-${SHA}
                    ports:
                      - containerPort: 8080
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      seccompProfile:
                        type: RuntimeDefault
                    resources:
                      requests:
                        memory: 32Mi
                        cpu: 10m
                      limits:
                        memory: 64Mi
                        cpu: 100m
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mynotes-web
          spec:
            selector:
              app: mynotes-web
            ports:
              - port: 80
                targetPort: 8080
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: mynotes-web
            annotations:
              tailscale.com/hostname: ${WEB_HOST}
          spec:
            ingressClassName: tailscale
            rules:
              - http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: mynotes-web
                          port:
                            number: 80
            tls:
              - hosts:
                  - ${WEB_HOST}
          EOF

          if ! kubectl rollout status deployment/mynotes-api -n "${NAMESPACE}" --timeout=180s; then
            echo "::group::kubectl get pods / describe / events"
            kubectl get pods -n "${NAMESPACE}" -o wide || true
            kubectl describe pod -n "${NAMESPACE}" || true
            kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' | tail -40 || true
            echo "::endgroup::"
            exit 1
          fi
          if ! kubectl rollout status deployment/mynotes-web -n "${NAMESPACE}" --timeout=120s; then
            echo "::group::kubectl get pods / describe / events"
            kubectl get pods -n "${NAMESPACE}" -o wide || true
            kubectl describe pod -n "${NAMESPACE}" || true
            kubectl get events -n "${NAMESPACE}" --sort-by='.lastTimestamp' | tail -40 || true
            echo "::endgroup::"
            exit 1
          fi

          # Wait for Tailscale to assign the address (up to 60s)
          for _ in $(seq 1 12); do
            ADDRESS=$(kubectl get ingress mynotes-web -n "${NAMESPACE}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            [ -n "$ADDRESS" ] && break
            sleep 5
          done
          echo "PREVIEW_URL=https://${ADDRESS:-${WEB_HOST}.${TS_NET}}" >> "$GITHUB_ENV"

      - name: Find preview comment
        uses: peter-evans/find-comment@v4
        id: find-preview-comment
        with:
          issue-number: ${{ env.PR_NUMBER }}
          comment-author: "github-actions[bot]"
          body-includes: Preview deployment ready

      - name: Comment preview URL on PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-preview-comment.outputs.comment-id }}
          issue-number: ${{ env.PR_NUMBER }}
          edit-mode: replace
          body: |
            ### Preview deployment ready
            🔗 ${{ env.PREVIEW_URL }}

            > Accessible only when connected to Tailscale
