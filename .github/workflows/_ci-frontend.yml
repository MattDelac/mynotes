name: CI Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --command pnpm store path | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Lint
        run: nix develop --command pnpm lint
        working-directory: apps/web

      - name: Type check
        run: nix develop --command pnpm check
        working-directory: apps/web

      - name: Unit tests
        run: nix develop --command pnpm test
        working-directory: apps/web

      - name: Build
        run: nix develop --command pnpm build
        working-directory: apps/web
