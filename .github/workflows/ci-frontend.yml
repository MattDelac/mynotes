name: CI Frontend

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "pnpm-*.yaml", "package.json", ".github/workflows/ci-frontend.yml"]
  pull_request:
    paths: ["apps/web/**", "pnpm-*.yaml", "package.json", ".github/workflows/ci-frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
