name: CI Frontend

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "pnpm-*.yaml", "package.json", ".github/workflows/ci-frontend.yml"]
  pull_request:
    paths: ["apps/web/**", "pnpm-*.yaml", "package.json", ".github/workflows/ci-frontend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --command pnpm store path | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Lint
        run: nix develop --command pnpm lint
        working-directory: apps/web

      - name: Type check
        run: nix develop --command pnpm check
        working-directory: apps/web

      - name: Unit tests
        run: nix develop --command pnpm test
        working-directory: apps/web

      - name: Build
        run: nix develop --command pnpm build
        working-directory: apps/web

  e2e:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            api/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(nix develop --command pnpm store path | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: nix develop --command npx playwright install chromium
        working-directory: apps/web

      - name: Run e2e tests
        run: nix develop --command pnpm exec playwright test
        working-directory: apps/web
        env:
          CI: "true"
