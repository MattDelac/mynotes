name: Bug report
description: Report a bug in MyNotes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before opening, search existing issues and confirm the bug reproduces on the latest `main` build.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Create a note and type "..." 
        3. ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Where does it happen?
      description: Live instance URL, or local dev (frontend/backend versions).
  - type: input
    id: browser
    attributes:
      label: Browser
      description: e.g. Chrome 126, Firefox 127, Safari 17 — plus OS if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Console output, network errors, or screenshots.
