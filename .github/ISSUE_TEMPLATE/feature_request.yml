name: Feature request
description: Suggest an idea for MyNotes
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Note the project deliberately stays minimal (one blank page, markdown only) — proposals that preserve that simplicity are the most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem this solves?
      description: The scenario and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How you'd imagine it working, including any keyboard/typing-first interaction.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you tried or other ways this could be solved.
