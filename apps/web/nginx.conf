server {
	listen 8080;
	server_name localhost;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_min_length 256;
	gzip_types text/plain text/css text/xml application/javascript application/json application/atom+xml image/svg+xml;

	gzip_static on;

	location ~* \.(css|js|jpg|jpeg|png|gif|webp|ico|woff2)$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		add_header Cache-Control "no-cache";
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.anthropic.com https://api.openai.com https://api.deepseek.com https://huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.hf.co https://cas-bridge.xethub.hf.co; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
		try_files $uri $uri/ /index.html;
	}
}
