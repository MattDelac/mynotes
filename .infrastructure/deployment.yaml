apiVersion: apps/v1
kind: Deployment
metadata:
  name: mynotes-api
  namespace: mynotes
spec:
  # Single replica: room channels are in-memory, and SQLite is single-writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mynotes-api
  template:
    metadata:
      labels:
        app: mynotes-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        fsGroup: 65532
      containers:
        - name: mynotes-api
          image: ghcr.io/mattdelac/mynotes-api:latest
          ports:
            - containerPort: 3000
          env:
            # Traefik sits in front, so rate limiting keys on X-Forwarded-For.
            - name: TRUST_PROXY_HEADERS
              value: "true"
            # Panic button: set to require this header for new room creation.
            # - name: CREATE_TOKEN
            #   value: "change-me-long-random-string"
            # Abuse-protection limits have sane defaults; override here if needed
            # (TTL_DAYS, RATE_CREATE_PER_MIN, MAX_WS_PER_IP, ... see docs/SELFHOST.md).
            - name: LITESTREAM_BUCKET
              valueFrom:
                secretKeyRef:
                  name: mynotes-litestream
                  key: bucket
                  optional: true
            - name: LITESTREAM_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: mynotes-litestream
                  key: endpoint
                  optional: true
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mynotes-litestream
                  key: access-key-id
                  optional: true
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mynotes-litestream
                  key: secret-access-key
                  optional: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mynotes-api-data
