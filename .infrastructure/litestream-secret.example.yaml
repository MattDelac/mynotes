# Copy to litestream-secret.yaml, fill in, and apply:
#   kubectl apply -f .infrastructure/litestream-secret.yaml
# The deployment runs fine without it — replication activates once the secret exists.
apiVersion: v1
kind: Secret
metadata:
  name: mynotes-litestream
  namespace: mynotes
type: Opaque
stringData:
  bucket: ""
  endpoint: "" # e.g. https://fsn1.your-objectstorage.com
  access-key-id: ""
  secret-access-key: ""
