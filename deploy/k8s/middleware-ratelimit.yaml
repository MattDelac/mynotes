# Optional Traefik middleware: ingress-level rate limiting (defense in depth on
# top of the app-level limits). k3s ships Traefik, so this is a plain CRD apply.
# After applying, uncomment the router.middlewares annotation in ingress.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mynotes-ratelimit
spec:
  rateLimit:
    # token bucket per source IP: ~2 req/s sustained, burst of 60
    average: 120
    period: 1m
    burst: 60
    sourceCriterion:
      ipStrategy:
        depth: 1
