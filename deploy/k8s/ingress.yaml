apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mynotes-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Ingress-level rate limiting — requires middleware-ratelimit.yaml to be applied.
    traefik.ingress.kubernetes.io/router.middlewares: default-mynotes-ratelimit@kubernetescrd
spec:
  rules:
    - host: api.mynotes.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mynotes-api
                port:
                  number: 80
